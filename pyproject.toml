[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmaguard"
version = "1.1.0"
description = "Tri-Source Evidence Fusion Agent for Postmarketing Adverse Drug Event Triage"
authors = [
    { name = "Krishna Sikheriya", email = "iit2023139@iiita.ac.in" }
]
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["pharmaguard"]